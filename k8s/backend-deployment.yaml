apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: chatapp-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: STORAGE_PROVIDER
              value: "local"
            - name: LOCAL_UPLOADS_DIR
              value: "/data/uploads"
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/chatapp"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
